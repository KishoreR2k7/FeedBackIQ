{% extends "base.html" %}

{% block title %}Change Password - FeedbackIQ{% endblock %}

{% block content %}
<div class="public-container" style="max-width: 440px; margin: 4rem auto;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 58px; height: 58px; border-radius: 16px; background: linear-gradient(135deg, var(--warning) 0%, var(--danger) 100%); color: white; margin-bottom: 1rem; box-shadow: 0 8px 24px rgba(245, 158, 11, 0.35);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.02em;">
            Update Your Password
        </h1>
        <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">
            A password update is required before accessing operational tools.
        </p>
    </div>

    <div class="glass-panel" style="padding: 2.25rem; box-shadow: var(--shadow-xl);">
        {% if error %}
        <div style="background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger); padding: 0.85rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
            <span>⚠️</span> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/change-password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="current_password" class="form-label">Current / Temporary Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required autofocus>
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Min. 8 characters" minlength="8" required>
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" minlength="8" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-weight: 800; justify-content: center;">
                Save Password & Enter Dashboard →
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="/logout" style="font-size: 0.825rem; color: var(--text-muted); text-decoration: none; font-weight: 600;" onmouseover="this.style.color='var(--danger)'" onmouseout="this.style.color='var(--text-muted)'">
                Sign Out Instead
            </a>
        </div>
    </div>
</div>
{% endblock %}
